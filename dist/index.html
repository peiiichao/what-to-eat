<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>What to Eat! 今天，吃點喜歡的。</title><style>
:root{--bg:#f7f6f2;--ink:#262820;--muted:#72756b;--accent:#c34725;--line:#e3e4dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c3472570;outline-offset:4px}header{max-width:1180px;margin:auto;padding:30px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:26px;font-weight:850;letter-spacing:-1.3px}.brand span{color:var(--accent)}.topnote{font-size:12px;color:var(--muted)}main{max-width:1180px;margin:auto;padding:55px 32px 36px}.hero{display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:30px;margin-bottom:35px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:16px}h1{font-size:clamp(32px,4.5vw,56px);line-height:1.25;letter-spacing:-2px;margin:0 0 15px}h1 span{color:var(--accent)}.intro{line-height:1.8;color:var(--muted);margin:0;font-size:15px}.ticket{justify-self:end;border:1px solid var(--line);border-radius:18px;padding:22px 28px;background:#fffefa;transform:rotate(3deg);width:270px;box-shadow:0 8px 20px #26282005}.ticket .big{font-size:46px;font-weight:800;letter-spacing:-3px}.ticket .small{font-size:12px;color:var(--muted);line-height:1.7}.ticket hr{border:0;border-top:1px dashed #d6d7cd;margin:15px 0}.ticketfoot{display:flex;justify-content:space-between;font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 6px 20px #26282003}.searchlabel{display:block;font-size:13px;font-weight:600;margin-bottom:10px}.searchrow{display:flex;gap:10px}.inputwrap{display:flex;align-items:center;gap:10px;background:#f7f7f3;border:1px solid var(--line);border-radius:12px;flex:1;padding:0 15px;min-width:0}.inputwrap span{font-size:22px;color:var(--accent)}input{border:0;background:transparent;padding:15px 0;width:100%;min-width:0;outline:none}input::placeholder{color:#85877d}.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 26px;font-weight:650;white-space:nowrap}.examples{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:12px 0 22px;flex-wrap:wrap}.example{border:0;background:none;color:#575e4b;padding:5px;text-decoration:underline;text-underline-offset:4px}.filters{border-top:1px solid #efefe8;padding-top:20px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.tabs{display:flex;background:#f4f4ee;border-radius:10px;padding:4px;gap:3px}.tabs button{border:0;border-radius:7px;background:transparent;color:#62665a;padding:10px 17px;font-size:13px;white-space:nowrap}.tabs button[aria-selected=true]{background:white;color:var(--accent);font-weight:700;box-shadow:0 2px 5px #00000009}select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px;font-size:13px;color:var(--ink)}.notice{margin:16px 2px 33px;display:flex;gap:9px;align-items:baseline;color:#77796f;font-size:12px;line-height:1.7}.notice strong{color:#8f4b30;white-space:nowrap}.resultshead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}h2{font-size:23px;letter-spacing:-.7px;margin:0 0 7px}.count{font-size:12px;color:var(--muted)}.shuffle{border:1px solid #bfc5b3;background:#eef0e8;color:#46543b;border-radius:10px;padding:12px 15px;font-weight:600;font-size:13px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}.art{height:112px;display:flex;align-items:center;justify-content:space-between;padding:22px 24px;position:relative;overflow:hidden}.artword{font-size:30px;letter-spacing:-1px;font-weight:800;opacity:.6}.artsub{font-size:10px;letter-spacing:2px;display:block;margin-top:5px}.food{font-size:56px;filter:saturate(.7);transform:rotate(-10deg)}.cardbody{padding:20px}.category{font-size:11px;color:var(--muted);margin-bottom:9px}.card h3{font-size:17px;line-height:1.5;margin:0 0 11px;min-height:51px}.rating{font-size:14px;font-weight:700}.star{color:var(--accent)}.reviews{font-size:12px;color:var(--muted);font-weight:400}.meta{font-size:12px;color:var(--muted);margin-top:13px}.cardfooter{margin-top:19px;padding-top:15px;border-top:1px solid #f0f0eb;display:flex;justify-content:space-between;align-items:center}.saved{color:#637255;font-size:11px}.maplink{color:var(--ink);text-decoration:none;font-size:12px;font-weight:650}.empty{text-align:center;padding:55px 20px;grid-column:1/-1;background:#fff;border:1px dashed #c8cbbd;border-radius:16px;line-height:1.9;color:var(--muted)}footer{display:flex;justify-content:space-between;max-width:1116px;margin:30px auto 0;padding:25px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}footer a{color:inherit}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2c3326;color:white;padding:15px 22px;border-radius:12px;max-width:90vw;width:max-content;box-shadow:0 8px 35px #0002;font-size:14px;z-index:10}.picked{outline:3px solid var(--accent);outline-offset:3px}@media(min-width:800px){.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px #26282008}.card{transition:transform .18s,box-shadow .18s}}@media(max-width:700px){header{padding:21px 20px}.brand{font-size:23px}.topnote{font-size:11px}main{padding:31px 18px 20px}.hero{display:block;margin-bottom:24px}.ticket{display:none}.eyebrow{font-size:10px;margin-bottom:12px}h1{font-size:36px;letter-spacing:-1.5px}.intro{font-size:13px}.panel{padding:17px;border-radius:18px}.primary{padding:0 17px;font-size:14px}.searchrow{gap:7px}.inputwrap{padding:0 10px}input{font-size:14px}.examples{margin-bottom:17px}.filters{gap:12px;padding-top:15px}.tabs{width:100%}.tabs button{flex:1;padding:10px 7px;font-size:12px}.filters select{width:100%}.notice{font-size:11px;margin-bottom:27px}h2{font-size:20px}.shuffle{padding:10px;font-size:12px}.grid{grid-template-columns:1fr;gap:14px}.card{display:grid;grid-template-columns:92px 1fr}.art{height:100%;padding:15px 8px;flex-direction:column;justify-content:center;gap:22px}.artword{font-size:14px;text-align:center}.artsub{font-size:8px;letter-spacing:1px}.food{font-size:41px}.cardbody{padding:17px}.card h3{font-size:16px;min-height:0}.cardfooter{margin-top:14px;padding-top:12px}.category{font-size:10px}footer{margin-top:25px;gap:15px;line-height:1.8;align-items:baseline}.count{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px;align-items:center}.categories span{font-size:12px;color:var(--muted);margin-right:3px}.categories button{font-size:12px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:white;color:#62665a}.categories button[aria-pressed=true]{background:#edf0e7;border-color:#81916c;color:#40532d;font-weight:650}</style></head><body><header><div class="brand">What to Eat<span>!</span></div><div class="topnote">Penny’s little food finder</div></header><main><section class="hero"><div><div class="eyebrow">GOOD FOOD, LESS OVERTHINKING</div><h1>今天，吃點<span>喜歡的。</span></h1><p class="intro">從你的口袋名單開始，<br>把「下次再吃」變成今天這一餐。</p></div><aside class="ticket" aria-label="清單摘要"><div class="small">你的 Google Maps 口袋清單</div><div class="big">789<span style="font-size:14px;letter-spacing:0;font-weight:400"> 個收藏地點</span></div><hr><div class="ticketfoot"><span>想去的地點 / Pei</span><span>好好吃飯 ↗</span></div></aside></section><section class="panel" aria-label="尋找餐廳"><form id="search"><label class="searchlabel" for="location">這一餐，想在哪裡吃？</label><div class="searchrow"><div class="inputwrap"><span aria-hidden="true">⌕</span><input id="location" placeholder="輸入地標，例如：中山站" autocomplete="off" maxlength="80"></div><button class="primary" type="submit">找吃的 ↗</button></div></form><div class="examples"><span>試試看</span><button class="example" data-location="中山站">中山站</button><button class="example" data-location="忠孝復興">忠孝復興</button><button class="example" data-location="西門站">西門站</button></div><div class="filters"><div class="tabs" role="tablist" aria-label="餐廳來源"><button role="tab" aria-selected="true" data-mode="saved">♡ 我的收藏</button><button role="tab" aria-selected="false" data-mode="rated">★ 收藏中 4.3+</button></div><select id="radius" aria-label="搜尋距離"><option value="1">附近 1 公里</option><option value="0.5">附近 500 公尺</option><option value="3">附近 3 公里</option></select></div><div class="categories" role="group" aria-label="餐飲分類"><span>想吃什麼</span><button type="button" data-category="all" aria-pressed="true">全部</button><button type="button" data-category="coffee" aria-pressed="false">咖啡</button><button type="button" data-category="diner" aria-pressed="false">餐廳</button><button type="button" data-category="pizza" aria-pressed="false">披薩</button><button type="button" data-category="bbq" aria-pressed="false">韓式燒烤</button></div></section><p class="notice"><strong>介面預覽</strong><span>目前展示 6 家收藏樣本。地點與距離僅示範操作，未連接定位或即時搜尋；評分為讀取清單時的快照。</span></p><section aria-labelledby="results-title"><div class="resultshead"><div><h2 id="results-title">先從口袋名單挑一家</h2><div class="count" id="count" aria-live="polite"></div></div><button class="shuffle" id="shuffle">幫我挑一家 ↝</button></div><div id="results" class="grid"></div></section><footer><span>少一點猶豫，多一點好吃的。</span><a href="https://maps.app.goo.gl/oEQNn48pXJp2pXrq7" target="_blank" rel="noopener">打開原始收藏清單 ↗</a></footer></main><div class="toast" id="toast" role="status" hidden></div><script>
const restaurants=[{name:'管家咖啡館',rating:5,count:110,group:'coffee',category:'咖啡店',word:'COFFEE',sub:'A LITTLE BREAK',emoji:'☕',bg:'#eeeee2',ink:'#61694d'},{name:'Greenriver Roastery．Archive',rating:4.1,count:309,group:'coffee',category:'咖啡店',word:'SLOW',sub:'SIP & STAY',emoji:'☕',bg:'#e5ece5',ink:'#536c59'},{name:'Peppa',rating:4.6,count:151,group:'diner',category:'小餐館',word:'BRUNCH',sub:'TAKE YOUR TIME',emoji:'🍳',bg:'#f4e9d7',ink:'#946c36'},{name:'識食餐室 ZEST DINER',rating:4.4,count:639,group:'diner',category:'餐廳',word:'DINER',sub:'A GOOD MEAL',emoji:'🍚',bg:'#f0e2d9',ink:'#99674f'},{name:'里歐帕朵・花豹吃披薩・Leopardo',rating:4.7,count:271,group:'pizza',category:'披薩餐廳',word:'PIZZA',sub:'ONE MORE SLICE',emoji:'🍕',bg:'#f2e7cc',ink:'#98743b'},{name:'金咕친구 韓式原塊烤肉 台北西門店',rating:4.9,count:10721,group:'bbq',category:'韓式燒烤餐廳',word:'GRILL',sub:'BETTER TOGETHER',emoji:'🥩',bg:'#ebe4df',ink:'#846d5f'}];
let mode='saved',category='all',locationText='',timer;const $=id=>document.getElementById(id);const filtered=()=>restaurants.filter(r=>(mode!=='rated'||r.rating>=4.3)&&(category==='all'||r.group===category));function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,4500)}function render(){const list=filtered();$('results-title').textContent=locationText?`${locationText}，今天想吃什麼？`:'先從口袋名單挑一家';$('count').textContent=`${list.length} 家示範店家 · ${mode==='rated'?'收藏樣本中 ≥ 4.3 分':'來自你的「想去的地點」'}${locationText?' · 尚未依實際距離篩選':''}`;$('results').replaceChildren(...list.map(r=>{const card=document.createElement('article');card.className='card';const idx=restaurants.indexOf(r);card.dataset.index=idx;card.innerHTML=`<div class="art" style="background:${r.bg};color:${r.ink}" aria-hidden="true"><div class="artword">${r.word}<span class="artsub">${r.sub}</span></div><span class="food">${r.emoji}</span></div><div class="cardbody"><div class="category">${r.category}</div><h3>${r.name}</h3><div class="rating"><span class="star">★</span> ${r.rating.toFixed(1)} <span class="reviews">(${r.count.toLocaleString()} 則評論)</span></div><div class="meta">距離、營業狀態待接入</div><div class="cardfooter"><span class="saved">♡ 已在收藏清單</span><a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name)}" target="_blank" rel="noopener">Google Maps ↗</a></div></div>`;return card}))}
$('search').addEventListener('submit',e=>{e.preventDefault();locationText=$('location').value.trim();if(!locationText){$('location').focus();toast('先輸入一個地標或地區吧');return}render();toast('這是搜尋流程預覽，目前仍顯示收藏樣本。')});document.querySelectorAll('[data-location]').forEach(b=>b.addEventListener('click',()=>{$('location').value=b.dataset.location;$('search').requestSubmit()}));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));render();if(mode==='rated')toast('先預覽收藏中 4.3 分以上的店；探索新店尚未接入。')}));document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));render()}));$('radius').addEventListener('change',()=>toast('已選擇 '+$('radius').selectedOptions[0].text+'；實際距離篩選尚未接入。'));$('shuffle').addEventListener('click',()=>{const list=filtered();if(!list.length){toast('這個分類暫時沒有符合條件的店家');return}const chosen=list[Math.floor(Math.random()*list.length)];document.querySelectorAll('.card').forEach(c=>c.classList.toggle('picked',Number(c.dataset.index)===restaurants.indexOf(chosen)));document.querySelector('.picked').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});toast('今天試試：'+chosen.name)});render();
</script></body></html>
